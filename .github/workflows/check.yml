name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: system libraries and fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libxkbcommon-dev libpam0g-dev pkg-config fontconfig fonts-dejavu-core
          mkdir -p ~/.local/share/fonts && cp fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
      - run: tools/check.sh
  nix:
    # flake.nix and nix/: both packages build from Cargo.lock in the Nix sandbox (docs/PACKAGING.md)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L --show-trace
